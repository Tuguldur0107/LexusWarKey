name: Build and release

# Tag a commit (git tag v1.1.0 && git push --tags) and this builds the portable exe
# and publishes it as a release asset. The app's updater looks for exactly that asset.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { $version = '1.0.0' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/LexusWarKey.Tests --nologo -v minimal

      - name: Publish portable exe
        run: >
          dotnet publish src/LexusWarKey -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version }}.0
          -p:FileVersion=${{ steps.version.outputs.version }}.0
          -o publish

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/LexusWarKey.exe -Algorithm SHA256).Hash
          "SHA256: $hash" | Tee-Object -FilePath publish/SHA256.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Lexus WarKey ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            publish/LexusWarKey.exe
            publish/SHA256.txt
